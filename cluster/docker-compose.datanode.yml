# Graylog HA cluster — DATA NODE stack (run on BOTH the MacBook and the Galaxy Book 3).
#
# Run from inside this directory so `.env` is auto-loaded for ${VAR} interpolation
# and the ../graylog-branding build context resolves:
#
#   cd cluster
#   cp .env.example .env        # then edit (OS_NODE_NAME/OS_PUBLISH_HOST differ per host)
#   docker compose -f docker-compose.datanode.yml up -d mongodb opensearch
#   # ...bring up mongodb+opensearch on the OTHER data node and the Surface Pro too,
#   #    then run ../cluster/rs-init.sh once (Mac), set index replicas=1, then:
#   docker compose -f docker-compose.datanode.yml up -d graylog graylog-fwd ngrok
#
# SECURITY: 9200/9300/27017 are published with NO TLS/auth. Keep them on a
# trusted Tailnet/LAN only — never forward them to the public internet. Only the
# two ngrok domains are public.

services:
  mongodb:
    image: mongo:7.0
    container_name: graylog-mongodb
    restart: unless-stopped
    # Replica-set member. Becomes primary/secondary per priority in rs-init.sh.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"          # reachable by the other members over Tailnet
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: graylog-opensearch
    restart: unless-stopped
    environment:
      # Referenced by opensearch.datanode.yml via ${VAR} substitution:
      - OS_NODE_NAME=${OS_NODE_NAME}
      - OS_PUBLISH_HOST=${OS_PUBLISH_HOST}
      - MAC_TS=${MAC_TS}
      - GB_TS=${GB_TS}
      - SP_TS=${SP_TS}
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      # Unused once security is off, but the 2.12 startup script still checks it.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Gr@yl0g-Admin-ChangeMe!
      # NOTE: deliberately NOT setting discovery.type or DISABLE_SECURITY_PLUGIN
      # here — both are handled by the mounted opensearch.datanode.yml.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"            # HTTP (Graylog talks to this)
      - "9300:9300"            # transport (inter-node cluster traffic)
    volumes:
      - ./opensearch.datanode.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  graylog:
    build:
      context: ../graylog-branding
      dockerfile: Dockerfile
    image: tok-scrape/graylog:7.0.6-lp
    container_name: graylog
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      # IDENTICAL on both data nodes (cluster requirement):
      GRAYLOG_PASSWORD_SECRET: "${GRAYLOG_PASSWORD_SECRET}"
      GRAYLOG_ROOT_PASSWORD_SHA2: "${GRAYLOG_ROOT_PASSWORD_SHA2}"
      GRAYLOG_HTTP_BIND_ADDRESS: "0.0.0.0:9000"
      # Public base URL (the pooled ngrok api domain) so generated links resolve:
      GRAYLOG_HTTP_EXTERNAL_URI: "https://tok-graylog-api.ngrok-free.dev/"
      GRAYLOG_HTTP_ENABLE_CORS: "true"
      GRAYLOG_HTTP_CORS_ALLOW_ORIGIN: "*"
      # Shared replica set + shared OpenSearch data nodes:
      GRAYLOG_MONGODB_URI: "mongodb://${MAC_TS}:27017,${GB_TS}:27017/graylog?replicaSet=rs0"
      GRAYLOG_ELASTICSEARCH_HOSTS: "http://${MAC_TS}:9200,http://${GB_TS}:9200"
    ports:
      - "127.0.0.1:9000:9000"   # local admin/UI only
      - "127.0.0.1:12202:12202" # GELF HTTP (local curl tests; ngrok reaches it in-network)
      - "12201:12201/udp"       # GELF UDP (optional)
      - "1514:1514"             # Syslog TCP (optional)
      - "1514:1514/udp"         # Syslog UDP (optional)
    volumes:
      - graylog_data:/usr/share/graylog/data
      - graylog_journal:/usr/share/graylog/data/journal

  # nginx that strips X-Frame-Options so the mobile app can iframe the dashboard.
  graylog-fwd:
    image: nginx:1.27
    container_name: graylog-fwd
    restart: unless-stopped
    depends_on:
      - graylog
    volumes:
      - ../graylog-branding/nginx-frame-strip.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:9001:9001"   # local test; ngrok reaches graylog-fwd:9001 in-network

  ngrok:
    image: ngrok/ngrok:3
    container_name: graylog-ngrok
    restart: unless-stopped
    depends_on:
      - graylog
      - graylog-fwd
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in cluster/.env (Pay-As-You-Go plan for pooling)}"
    volumes:
      - ./ngrok.cluster.yml:/etc/ngrok.yml:ro
    command: ["start", "--all", "--config", "/etc/ngrok.yml"]
    ports:
      - "127.0.0.1:4040:4040"   # local inspector

volumes:
  mongodb_data:
  opensearch_data:
  graylog_data:
  graylog_journal:
