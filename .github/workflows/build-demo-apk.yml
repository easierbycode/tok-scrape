# Build the mobile-demo Cordova app and commit the APK to main as /demo.apk,
# served by GitHub Pages at https://easierbycode.com/tok-scrape/demo.apk.
# Pages on this repo serves the main branch root (same pattern as chrome.zip /
# build-extension-zip.yml and the preloaded APKs / build-apk-preloaded.yml).
#
# extension-creator-demo/** is in the paths filter because mobile-demo bundles
# those files under www/ext (synced via scripts/sync-extension-demo.js), so a
# change to the extension demo must also refresh the APK.
name: build-demo-apk

on:
  push:
    branches: [main]
    paths:
      - 'mobile-demo/**'
      - 'extension-creator-demo/**'
      - '.github/workflows/build-demo-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

# Serialize publishes so two concurrent runs don't race committing demo.apk.
concurrency:
  group: build-demo-apk-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # cordova-android@13 compiles against SDK 34.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Install mobile-demo deps
        working-directory: mobile-demo
        run: npm ci

      # Refresh www/ext from extension-creator-demo so the APK always ships
      # the current extension demo code, even if the synced copies in git are
      # stale.
      - name: Sync extension demo files
        working-directory: mobile-demo
        run: npm run sync:extension-demo

      # Unlike mobile-app, this package has no `prepare` npm script, and
      # `cordova build` alone errors with "No platforms added to this
      # project" on a fresh checkout. `cordova prepare android` restores the
      # platform from package.json's cordova.platforms, using the
      # cordova-android version pinned in devDependencies.
      - name: Restore Android platform
        working-directory: mobile-demo
        run: cordova prepare android

      - name: Build APK
        working-directory: mobile-demo
        run: cordova build android --debug

      - name: Stage APK as demo.apk
        run: |
          set -euo pipefail
          src=mobile-demo/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          cp "$src" demo.apk
          ls -lh demo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-apk
          path: demo.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Real checkout (not shallow) so we can commit + push back.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: demo-apk

      # Commit only if the APK is new/changed. The workflow's `paths:` filter
      # scopes to mobile-demo/** + extension-creator-demo/** + the workflow
      # file, so this commit (which only touches root demo.apk) doesn't loop
      # the build.
      - name: Commit demo.apk to main
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -z "$(git status --porcelain -- demo.apk)" ]; then
            echo 'demo.apk unchanged — skipping commit.'
            exit 0
          fi
          git add -- demo.apk
          git commit -m "chore: refresh demo.apk from ${GITHUB_SHA::7}

          Auto-generated by build-demo-apk.yml. The workflow's path filter
          excludes root *.apk so this commit doesn't loop the build.
          [skip ci]"
          # Retry-with-rebase loop: build-apk-preloaded and publish-web-bundle
          # also auto-commit to main and can race this push. The touched files
          # are disjoint (demo.apk vs other root *.apk / manifest.json /
          # bundle-*.zip), so the rebase is clean. Mirrors those workflows.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed -- pulling latest and retrying"
            git pull --rebase origin main
          done
          echo 'Push failed after 4 attempts'
          exit 1
