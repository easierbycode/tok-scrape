# Build per-member, pre-loaded APKs and publish them to gh-pages so each is
# reachable at https://easierbycode.com/tok-scrape/<tag>.apk.
#
# The Graylog URL/token are passed via repo secrets (GRAYLOG_URL_PROD /
# GRAYLOG_TOKEN_PROD). The `member_id` input selects whose identity is baked
# into the APK -- it can be:
#   - a single id          (e.g. "wizardofdealz")            -> app-<id>.apk
#   - a comma-separated    (e.g. "boosteddealsdaily,prettyplug.x,wizardofdealz")
#     list (one APK)                                          -> app-<first>+<N-1>.apk
#   - "all"                                                   -> one APK per
#                                                                roster entry,
#                                                                fanned out across
#                                                                the matrix
#
# Auto-runs on push to main for changes under mobile-app/** and builds the
# default "boosteddealsdaily+2" multimember APK.
name: build-apk-preloaded

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-apk-preloaded.yml'
  workflow_dispatch:
    inputs:
      member_id:
        description: 'Single id, comma-separated multi-member list, or "all" to fan out per roster entry.'
        required: true
        default: 'boosteddealsdaily,prettyplug.x,wizardofdealz'
      common_dashboard_id:
        description: 'Optional Graylog dashboard id to embed. Leave blank to look up/create "Seller Comparison".'
        required: false
        default: ''

# Needed for the publish job to push to gh-pages.
permissions:
  contents: write

# Serialize gh-pages writes across concurrent runs of this workflow so two
# pushes don't race when committing to the same branch.
concurrency:
  group: build-apk-preloaded-publish
  cancel-in-progress: false

env:
  # Default MEMBER_ID for push-triggered runs (workflow_dispatch overrides via input).
  DEFAULT_MEMBERS: 'boosteddealsdaily,prettyplug.x,wizardofdealz'

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      members: ${{ steps.pick.outputs.members }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          INPUT_MEMBER_ID: ${{ inputs.member_id }}
        # Push runs use DEFAULT_MEMBERS. Dispatch with "all" fans out per
        # roster entry; anything else is treated as a single MEMBER_ID arg
        # (which may itself be comma-separated for a multi-member APK).
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            raw="$INPUT_MEMBER_ID"
          else
            raw="$DEFAULT_MEMBERS"
          fi
          if [ "$raw" = "all" ]; then
            ids=$(grep -oE "id:\s*'[^']+'" mobile-app/www/js/users.js \
                  | sed -E "s/id:\s*'([^']+)'/\1/" \
                  | grep -v '^daniel$' \
                  | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            ids=$(jq -nc --arg v "$raw" '[$v]')
          fi
          echo "members=$ids" >> "$GITHUB_OUTPUT"
          echo "members: $ids"

  build:
    needs: resolve-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member_id: ${{ fromJSON(needs.resolve-matrix.outputs.members) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Install mobile-app deps
        working-directory: mobile-app
        run: npm ci

      - name: Add Android platform
        working-directory: mobile-app
        run: cordova platform add android

      # The build script names the APK after the canonical tag:
      #   single id           -> "<id>"
      #   multi-member list   -> "<first-id>+<N-1>"
      # Compute the same tag here so we can name the upload artifact predictably
      # without commas (artifact names are easier to reason about as plain
      # alphanumerics + "+").
      - name: Compute APK tag
        id: tag
        env:
          MEMBER_ID: ${{ matrix.member_id }}
        run: |
          set -euo pipefail
          ids=$(printf '%s\n' "$MEMBER_ID" \
                | tr ',' '\n' \
                | sed -E 's/^[[:space:]]*@*//; s/[[:space:]]+$//' \
                | tr 'A-Z' 'a-z' \
                | awk 'NF')
          count=$(printf '%s\n' "$ids" | wc -l | tr -d ' ')
          first=$(printf '%s\n' "$ids" | head -n1)
          if [ "$count" -le 1 ]; then
            tag="$first"
          else
            tag="${first}+$((count-1))"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag"

      - name: Build pre-loaded APK
        working-directory: mobile-app
        env:
          MEMBER_ID: ${{ matrix.member_id }}
          GRAYLOG_URL: ${{ secrets.GRAYLOG_URL_PROD }}
          GRAYLOG_TOKEN: ${{ secrets.GRAYLOG_TOKEN_PROD }}
          COMMON_DASHBOARD_ID: ${{ inputs.common_dashboard_id }}
        run: npm run build:preloaded

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.tag.outputs.tag }}
          path: mobile-app/dist/app-${{ steps.tag.outputs.tag }}.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'app-*'

      # Stage each APK under public/ with the leading "app-" stripped, so the
      # published URL matches the build tag exactly:
      #   app-boosteddealsdaily+2.apk -> public/boosteddealsdaily+2.apk
      # peaceiris/actions-gh-pages with keep_files: true preserves the existing
      # app.apk / index.html / bookmarklet.html / .nojekyll already on the
      # gh-pages branch.
      - name: Stage gh-pages payload
        run: |
          set -euo pipefail
          mkdir -p public
          shopt -s nullglob
          for apk in artifacts/*/app-*.apk; do
            name=$(basename "$apk")
            out="${name#app-}"
            cp "$apk" "public/$out"
          done
          ls -la public/
          test -n "$(ls -A public 2>/dev/null)" || { echo 'no APKs to publish'; exit 1; }

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
          commit_message: 'build: preloaded APK(s) from ${{ github.sha }}'
